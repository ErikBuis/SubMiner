name: Probe foreground hook
on:
  push:
    branches: [probe/win-foreground-hook]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: npx esbuild src/window-trackers/win32.ts --bundle --platform=node --format=cjs --external:koffi --outfile=probe-out/win32.js
      - run: npx electron scripts/probe/foreground-hook-probe.cjs
